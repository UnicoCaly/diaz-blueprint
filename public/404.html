<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Diaz Blueprint Lot Check</title>
  <!-- With this file present, Cloudflare Pages returns a real 404 for unknown paths
       instead of serving index.html with a 200 (the old soft-404 behavior). -->
  <meta name="robots" content="noindex" />
  <script>
    // Old bio links put the UTM tags after an encoded '#' (/%23utm_source=...). Send them to the tool with a real query string.
    (function () {
      try {
        var p = decodeURIComponent(location.pathname);
        if (p.indexOf('/#') === 0) location.replace('/?' + p.slice(2) + location.search.replace(/^\?/, '&'));
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/ds.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="main" class="dbp-section lc-404">
    <div class="dbp-section__inner dbp-section__inner--narrow">
      <p><a href="/"><img src="/assets/dbp-logo-blue.png" width="160" height="40" alt="Diaz Blueprint &amp; Drafting Services" /></a></p>
      <h1>That page isn't here.</h1>
      <p>The link may be old, or the address may have a typo. The Lot Check is one click away. It's free, takes about two minutes, and only needs your address.</p>
      <p><a class="dbp-btn dbp-btn--primary" href="/">Go to the Lot Check</a></p>
      <p>Rather talk to a person? Call us: <a href="tel:+13235668096"><strong>323.566.8096</strong></a>. <span lang="es">Hablamos Español.</span></p>
    </div>
  </main>
</body>
</html>
